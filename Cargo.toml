[workspace]
resolver = "3"
members = ["crates/*", "platforms/macos"]
default-members = ["crates/quant_access", "crates/quant_api", "crates/quant_capture_macos", "crates/quant_cli", "crates/quant_client", "crates/quant_collector", "crates/quant_core", "crates/quant_crypto", "crates/quant_daemon", "crates/quant_derive", "crates/quant_learn", "crates/quant_mcp", "crates/quant_relay", "crates/quant_store"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/leptoskit/quant"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
quant_model = { path = "crates/quant_model" }
quant_service = { path = "crates/quant_service" }
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
leptoskit_bridge = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
leptoskit_plugin_autostart = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_plugin_device_keys = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_plugin_menu = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_plugin_tray = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_testing = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_wasm = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
dispatch2 = "0.3"
png = "0.18"
relay_db = { path = "crates/relay_db" }
leptoskit_axum = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_db = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
landing_shared = { path = "crates/landing_shared" }
leptoskit_router = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e", default-features = false }
skribble_leptoskit = { git = "https://github.com/openbudgetfun/skribble", rev = "46b8e635b1d983f92054d13fcc0bc513e7b9a43c" }
quant_core = { path = "crates/quant_core" }
quant_access = { path = "crates/quant_access" }
quant_store = { path = "crates/quant_store" }
quant_crypto = { path = "crates/quant_crypto" }
quant_api = { path = "crates/quant_api" }
quant_client = { path = "crates/quant_client" }
quant_daemon = { path = "crates/quant_daemon" }
quant_derive = { path = "crates/quant_derive" }
quant_learn = { path = "crates/quant_learn" }
quant_mcp = { path = "crates/quant_mcp" }
quant_relay = { path = "crates/quant_relay" }
quant_capture_macos = { path = "crates/quant_capture_macos" }

anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
block2 = "0.6"
cpal = "0.18"
data-encoding = "2"
futures-util = "0.3"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "3", features = ["zeroize"] }
getrandom = "0.4"
hex = "0.4"
hyper = "1"
hyper-util = "0.1"
http-body-util = "0.1"
libc = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
jiff = { version = "0.2", features = ["serde"] }
qrcode = { version = "0.14", default-features = false }
rcgen = "0.14"
p256 = { version = "0.13", features = ["ecdsa"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = "0.3"
objc2-avf-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-media = "0.3"
objc2-foundation = "0.3"
objc2-image-io = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-speech = "0.3"
objc2-vision = "0.3"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
whisper-rs = "0.16"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
similar_names = "allow"
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.release.build-override]
strip = "none"

[patch.crates-io]
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "92ac609ece229043427c7edd7964a7ec7518696e" }
