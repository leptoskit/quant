[package]
name = "quant_android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "leptoskit_app"
crate-type = ["staticlib"]

[target.'cfg(target_os = "android")'.dependencies]
leptoskit_bridge_ffi = { workspace = true, features = ["app"] }
# The plugins are direct dependencies only so the leptoskit CLI discovers them
# from this package's metadata, registers their Kotlin handlers, and merges
# their permissions and services into the manifest. The Rust host never names
# them; the screen's guest calls them.
leptoskit_plugin_app_usage = { workspace = true }
leptoskit_plugin_background = { workspace = true }
leptoskit_plugin_battery = { workspace = true }
leptoskit_plugin_ble = { workspace = true }
leptoskit_plugin_health = { workspace = true }
leptoskit_plugin_location = { workspace = true }
leptoskit_plugin_notifications = { workspace = true }
leptoskit_plugin_pedometer = { workspace = true }
leptoskit_plugin_secure_store = { workspace = true }
leptoskit_plugin_sensors = { workspace = true }
leptoskit_plugin_thermal = { workspace = true }
leptoskit_plugin_watch_sync = { workspace = true }
# The app's own native service: the encrypted spool and the vault connection.
quant_phone = { workspace = true }

# The generated registrant exports C entry points, which the workspace's
# `unsafe_code = "deny"` would refuse.
[lints]

[lints.cargo]
unused_dependencies = "allow"
