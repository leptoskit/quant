[package]
name = "quant_ios"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "leptoskit_app"
crate-type = ["staticlib"]

[target.'cfg(target_os = "ios")'.dependencies]
leptoskit_bridge_ffi = { workspace = true, features = ["app"] }
# The plugins are direct dependencies only so the leptoskit CLI discovers them
# from this package's metadata, registers their Swift handlers, and adds what
# they declare to Info.plist (the location background mode, and the usage
# strings it checks are present). The Rust host never names them; the
# screen's guest calls them.
#
# `notifications` is left out on purpose: iOS has no foreground service to
# announce. `background` registers its app-refresh handler from App.swift
# while the app launches, which is the only time iOS accepts it. See
# docs/phone.md.
leptoskit_plugin_app_usage = { workspace = true }
leptoskit_plugin_background = { workspace = true }
leptoskit_plugin_battery = { workspace = true }
leptoskit_plugin_location = { workspace = true }
leptoskit_plugin_secure_store = { workspace = true }
leptoskit_plugin_thermal = { workspace = true }
# The app's own native service: the encrypted spool and the vault connection.
quant_phone = { workspace = true }

# The generated registrant exports C entry points, which the workspace's
# `unsafe_code = "deny"` would refuse.
[lints]

[lints.cargo]
unused_dependencies = "allow"
