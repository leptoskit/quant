[package]
name = "quant_capture_macos"
description = "First-party macOS capture: screen frames with OCR, app focus, input activity, and microphone speech."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Transcribe speech with whisper.cpp (Metal-accelerated). Building it needs
# `cmake` and a C++ toolchain; set `audio.whisper_model` to a ggml model.
whisper = ["dep:whisper-rs", "whisper-rs/metal"]

[dependencies]
jiff = { workspace = true }
quant_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
cpal = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
objc2-image-io = { workspace = true }
objc2-screen-capture-kit = { workspace = true }
objc2-vision = { workspace = true }
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
