[package]
name = "quant_app"
description = "The Quant screens: the desktop window (status, saved moments, agents, audit) and the phone collector."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# Synthetic, disconnected UI for design review. Never enable in a release.
ui-preview = []
# The native Wasm guest. The window talks only to the app's own service.
native = ["leptoskit/guest", "leptoskit_bridge/guest"]
macos = ["native", "leptoskit/macos"]
# The phone screen and its collector, in place of the desktop window. The
# guest drives the plugins that record location, app usage, battery and
# thermal state, and hands what they report to the `quant-phone` service.
phone = [
	"native",
	"dep:leptoskit_plugin_app_usage",
	"dep:leptoskit_plugin_background",
	"dep:leptoskit_plugin_battery",
	"dep:leptoskit_plugin_location",
	"dep:leptoskit_plugin_notifications",
	"dep:leptoskit_plugin_secure_store",
	"dep:leptoskit_plugin_thermal",
]
android = ["phone", "leptoskit/android"]
ios = ["phone", "leptoskit/ios"]
# The DevTools agents; `leptoskit dev` turns this on, `leptoskit build` never does.
devtools = ["leptoskit/devtools"]

[dependencies]
leptoskit = { workspace = true }
quant_model = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_bridge = { workspace = true }
leptoskit_plugin_app_usage = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_background = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_battery = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_device_keys = { workspace = true, features = ["guest"] }
leptoskit_plugin_location = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_notifications = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_secure_store = { workspace = true, features = ["guest"], optional = true }
leptoskit_plugin_thermal = { workspace = true, features = ["guest"], optional = true }

[dev-dependencies]
leptoskit_testing = { workspace = true }
reactive_graph = { workspace = true }

[build-dependencies]
leptoskit_build = { workspace = true }

[lints]
workspace = true
