[package]
name = "quant_client"
description = "A client for the Quant daemon that signs every request with its own key."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rustls = { workspace = true }
sha2 = { workspace = true }
tokio-rustls = { workspace = true }
hex = { workspace = true }
bytes = "1"
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff = { workspace = true }
quant_access = { workspace = true }
quant_api = { workspace = true }
quant_core = { workspace = true }
quant_relay = { workspace = true, default-features = false, features = ["dial"] }
