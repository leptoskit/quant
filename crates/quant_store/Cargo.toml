[package]
name = "quant_store"
description = "The encrypted vault: SQLCipher records and series, full-text search, sealed media, grants, and the audit chain."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["keychain"]
keychain = ["quant_crypto/keychain"]

[dependencies]
blake3 = { workspace = true }
jiff = { workspace = true }
quant_access = { workspace = true }
quant_core = { workspace = true }
