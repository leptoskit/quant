[package]
name = "quant_cli"
description = "The `quant` command: set up a vault, run the daemon, pair and approve agents, and query your life."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quant"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
jiff = { workspace = true }
quant_access = { workspace = true }
quant_api = { workspace = true }
quant_client = { workspace = true }
quant_core = { workspace = true }
quant_crypto = { workspace = true }
quant_daemon = { workspace = true }
quant_mcp = { workspace = true }
quant_relay = { workspace = true, default-features = false }
quant_store = { workspace = true }
qrcode = { workspace = true }
rpassword = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
