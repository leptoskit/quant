name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Validate the single application structure
        run: python3 scripts/check-project.py
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test watch and phone app crates
        run: |
          cargo test --locked -p quant_app -p quant_model -p quant_phone
          cargo test --locked -p quant_app -p quant_model -p quant_phone --features quant_phone/watch
      - name: Check phone and wearable Wasm guest targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features android
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features ios
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features wearos
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features watchos
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features harmonyos
          cargo check --locked --target wasm32-unknown-unknown -p quant_app --features harmonyos-watch
