name: application-targets

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Optional git ref or commit SHA to check out
        required: false
        type: string
        default: ''
  # A merge made with the repository token starts no push run, so allow a manual one.
  workflow_dispatch:
    inputs:
      ref:
        description: Optional git ref or commit SHA to check out
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: application-targets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: desktop
            runner: macos-latest
            packages: -p quant_app -p quant_model -p quant_service
            build: build --release
          # The phone collector. A release needs the upload keystore, so this
          # job builds the debug APK: the Rust host cross-compiled with the
          # runner's NDK, the plugins' Kotlin, and the Gradle project.
          - target: android
            runner: ubuntu-latest
            packages: -p quant_app -p quant_model -p quant_phone
            build: build
          # The Wear OS smartwatch collector (Pixel Watch, Samsung Galaxy Watch,
          # Wear OS 3+). Builds the debug APK with watch plugins, TileService,
          # and ComplicationDataSource.
          - target: wearos
            runner: ubuntu-latest
            packages: -p quant_app -p quant_model -p quant_phone
            build: build
          # The same collector on an iPhone. This builds the Rust host, the
          # guest and the generated Xcode project for a device, unsigned:
          # signing needs an Apple team, which CI does not have.
          - target: ios
            runner: macos-latest
            packages: -p quant_app -p quant_model -p quant_phone
            build: build
          - target: relay
            runner: ubuntu-latest
            packages: -p relay -p relay_db
            build: build --release
          - target: landing
            runner: ubuntu-latest
            packages: -p landing -p landing_app -p landing_backend -p landing_shared
            build: build --release
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: target-${{ matrix.target }}
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --all-targets ${{ matrix.packages }}
      - name: Clippy
        run: cargo clippy --locked --all-targets ${{ matrix.packages }} -- -D warnings
      - name: Test
        run: cargo test --locked ${{ matrix.packages }}
      - name: Read the SDK revision
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          revision = manifest['workspace']['dependencies']['leptoskit']['rev']
          assert re.fullmatch(r'[0-9a-f]{40}', revision), 'Expected a pinned SDK revision'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'LEPTOSKIT_REV={revision}\n')
          PY
      - name: Install the matching SDK CLI
        run: cargo install --git https://github.com/leptoskit/leptoskit --rev "$LEPTOSKIT_REV" --locked leptoskit_cli
      - name: Leptoskit lint and workspace configuration
        run: |
          leptoskit targets
          leptoskit --app-target ${{ matrix.target }} lint --no-clippy
      - name: Install Binaryen
        if: matrix.target == 'landing'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/binaryen.tar.gz"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
      - name: Install esbuild
        if: matrix.target == 'landing'
        # Release builds minify the Wasm glue with esbuild.
        run: npm install --global esbuild@0.28.2
      - name: Add the Android Rust target
        if: matrix.target == 'android' || matrix.target == 'wearos'
        run: rustup target add aarch64-linux-android
      - name: Add the iOS Rust target
        if: matrix.target == 'ios'
        run: rustup target add aarch64-apple-ios
      - name: Point cc at the NDK's ranlib
        if: matrix.target == 'android' || matrix.target == 'wearos'
        # The pinned CLI gives cc the NDK's llvm-ar but not llvm-ranlib, so
        # the vendored OpenSSL looks for aarch64-linux-android-ranlib, which
        # no NDK ships. Drop this once the pin includes leptoskit's fix.
        run: scripts/android-device.sh ranlib >> "$GITHUB_ENV"
      - name: Build
        run: leptoskit --app-target ${{ matrix.target }} ${{ matrix.build }}
      - name: Build the quant CLI and daemon
        if: matrix.target == 'desktop'
        # The macOS app ships this binary, and the release runbook requires it.
        run: cargo build --locked --release -p quant_cli --bin quant
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'android' || matrix.target == 'wearos'
        with:
          name: quant-${{ matrix.target }}-debug
          path: platforms/${{ matrix.target }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/setup-node@v4
        if: matrix.target == 'landing'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser checks
        if: matrix.target == 'landing'
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
      - name: Hydrated browser regression checks
        if: matrix.target == 'landing'
        env:
          LEPTOS_ENV: PROD
          LEPTOS_SITE_ADDR: 127.0.0.1:4202
          LEPTOS_OUTPUT_NAME: landing_app
          LEPTOS_SITE_ROOT: ${{ github.workspace }}/dist/landing
        run: |
          set -euo pipefail
          mkdir -p test-results
          target/release/landing > test-results/server.log 2>&1 &
          quant_site_pid=$!
          trap 'kill "$quant_site_pid" 2>/dev/null || true; wait "$quant_site_pid" || true' EXIT
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4202/readyz > /dev/null; then
              break
            fi
            kill -0 "$quant_site_pid"
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4202/readyz > /dev/null
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'landing'
        with:
          name: landing-browser-results
          path: test-results
          if-no-files-found: ignore
