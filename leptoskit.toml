#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json
# One application, one Cargo workspace, independently selected destinations.
schema_version = 0

[app]
name = "quant"
version = "0.1.0"
default_target = "desktop"
default_platform = "macos"
platforms = ["web", "server", "macos", "android", "ios", "wearos", "watchos", "harmonyos"]
icon = "assets/brand/icon.svg"

# The full-bleed drawing, for platforms that mask the icon themselves.
[app.icons]
image = "assets/brand/icon-square.svg"

# macOS draws no mask, so it gets the mark on Apple's rounded square.
[app.icons.macos]
image = "assets/brand/icon.svg"

[frontends.app]
package = "quant_app"
render = "csr"

[frontends.app.lint]
markup = "builder"
exclude = ["crates/landing_app/**"]

[frontends.app.lint.rules]
markup_style = "deny"
component_attribute = "deny"

[frontends.app.inputs]
assets = "assets/app"
web = "web/app"
public = "public/app"

[frontends.landing]
package = "landing_app"
server_package = "landing"
render = "ssr"

[frontends.landing.inputs]
assets = "assets/landing"
web = "web/landing"
public = "public/landing"

[frontends.landing.router]
dir = "crates/landing_app/src/routes"

[frontends.landing.lint]
markup = "view"
exclude = ["crates/quant_app/**"]

[frontends.landing.lint.rules]
markup_style = "deny"
component_attribute = "deny"

[targets.desktop]
platform = "macos"
frontend = "app"

[targets.desktop.native]
mode = "menu-bar"
package_id = "dev.leptoskit.quant"
viewport_width = 620.0
viewport_height = 780.0
plugins = ["quant", "device-keys"]

[targets.landing]
platform = "web"
frontend = "landing"

# Local design review only: the guest uses synthetic data and no vault bridge.
[targets.desktop-preview]
platform = "macos"
frontend = "app"

[targets.desktop-preview.build]
backend = false
client_package = "quant_app"
features = ["ui-preview"]

[targets.desktop-preview.build.inputs]
assets = "assets/app"

[targets.desktop-preview.native]
mode = "menu-bar"
package_id = "dev.leptoskit.quant"
viewport_width = 620.0
viewport_height = 780.0
plugins = ["quant", "device-keys"]

[targets.landing.serve]
address = "127.0.0.1"
port = 3000
probes = true

[targets.relay]
platform = "server"

[targets.relay.build]
backend = true
server_package = "relay"

[targets.relay.serve]
address = "127.0.0.1"
port = 3001
probes = true

[targets.relay.db]
dialect = "sqlite"
crate = "relay_db"
migrations = "crates/relay_db/migrations"
url_env = "DATABASE_URL"

# These destinations belong to this application. Their transports/hosts must
# be integrated before selection can build a working Quant client.
[targets.web]
platform = "web"
frontend = "app"
unavailable = "The product UI still uses the native service bridge; its authenticated browser transport is not implemented."

# The phone collector. Its guest is the same `quant_app` crate with the
# `android` feature, which swaps the desktop window for the phone's screen.
# The host is platforms/android; its native service is `quant-phone`.
[targets.android]
platform = "android"
frontend = "app"

[targets.android.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"location",
	"app-usage",
	"health",
	"pedometer",
	"sensors",
	"watch-sync",
	"ble",
	"battery",
	"thermal",
	"background",
	"secure-store",
	"notifications",
]

# The same phone collector on an iPhone. The host is platforms/ios. Location
# updates with the "Always" grant keep the app running; `background` adds
# iOS app refresh, which wakes the service to deliver while Quant is
# suspended. iOS has no foreground service to announce, so `notifications`
# is not selected. App usage is only lock and unlock there. See
# docs/phone.md and docs/wearables.md.
[targets.ios]
platform = "ios"
frontend = "app"

[targets.ios.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"location",
	"app-usage",
	"health",
	"pedometer",
	"sensors",
	"watch-sync",
	"ble",
	"battery",
	"thermal",
	"background",
	"secure-store",
]

# Wear OS smartwatch collector (Pixel Watch, Samsung Galaxy Watch / One UI
# Watch, TicWatch, and all Wear OS 3+ devices). Runs standalone with direct
# pinned-TLS uploads plus companion phone sync via `watch-sync`.
[targets.wearos]
platform = "wearos"
frontend = "app"

[targets.wearos.build]
client_package = "quant_app"
features = ["wearos"]

[targets.wearos.build.inputs]
assets = "assets/app"

[targets.wearos.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"wearable",
	"health",
	"pedometer",
	"sensors",
	"watch-sync",
	"ble",
	"location",
	"battery",
	"thermal",
	"background",
	"secure-store",
	"notifications",
]

[targets.wearos.native.wearos]
standalone = true
tile = true
complication = true
samsung-health-sensor = true

# Apple Watch (watchOS 10+) collector with HealthKit live/passive wrist sensors,
# CoreMotion pedometer/motion, WatchConnectivity companion sync, and BLE GATT.
[targets.watchos]
platform = "watchos"
frontend = "app"

[targets.watchos.build]
client_package = "quant_app"
features = ["watchos"]

[targets.watchos.build.inputs]
assets = "assets/app"

[targets.watchos.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"wearable",
	"health",
	"pedometer",
	"sensors",
	"watch-sync",
	"ble",
	"location",
	"battery",
	"thermal",
	"secure-store",
]

[targets.watchos.native.watchos]
standalone = true
companion-bundle-id = "dev.leptoskit.quant"
deployment-target = "10.0"
workout-background = true
complications = true

# Huawei HarmonyOS phone & tablet collector (experimental).
[targets.harmonyos]
platform = "harmonyos"
frontend = "app"

[targets.harmonyos.build]
client_package = "quant_app"
features = ["harmonyos"]

[targets.harmonyos.build.inputs]
assets = "assets/app"

[targets.harmonyos.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"health",
	"pedometer",
	"watch-sync",
	"ble",
	"battery",
	"thermal",
	"secure-store",
]

[targets.harmonyos.native.harmonyos]
device-types = ["phone", "tablet"]
permissions = [
	"ohos.permission.INTERNET",
	"ohos.permission.READ_HEALTH_DATA",
	"ohos.permission.ACTIVITY_MOTION",
	"ohos.permission.ACCESS_BLUETOOTH",
	"ohos.permission.KEEP_BACKGROUND_RUNNING",
]

# Huawei Watch (HarmonyOS Wearable) collector (experimental).
[targets.harmonyos-watch]
platform = "harmonyos"
frontend = "app"

[targets.harmonyos-watch.build]
client_package = "quant_app"
features = ["harmonyos-watch"]

[targets.harmonyos-watch.build.inputs]
assets = "assets/app"

[targets.harmonyos-watch.native]
package_id = "dev.leptoskit.quant"
plugins = [
	"quant-phone",
	"wearable",
	"health",
	"pedometer",
	"watch-sync",
	"ble",
	"battery",
	"thermal",
	"secure-store",
]

[targets.harmonyos-watch.native.harmonyos]
device-types = ["wearable"]
permissions = [
	"ohos.permission.INTERNET",
	"ohos.permission.READ_HEALTH_DATA",
	"ohos.permission.ACTIVITY_MOTION",
	"ohos.permission.ACCESS_BLUETOOTH",
	"ohos.permission.KEEP_BACKGROUND_RUNNING",
]

[bundle]
optimize = "fast"
split = true
wasm_opt = true
precompress = true

[native]
package_id = "dev.leptoskit.quant"

[codepush]
enabled = false

[lint]
markup = "builder"
# The landing job enforces its own frontend's view-style rules.
exclude = ["crates/landing_app/**"]

[lint.rules]
markup_style = "deny"
component_attribute = "deny"
