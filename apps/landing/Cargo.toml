# The Quant landing page: the marketing site, separate from the product app.
#
# Its own workspace, outside the core one, like the desktop app and the relay,
# scaffolded the way `leptoskit new --frontends landing` writes a landing
# frontend. See readme.md.
[workspace]
resolver = "3"
members = ["landing_app", "landing_backend", "landing_shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/leptoskit/quant"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
landing_shared = { path = "landing_shared" }
# Use the same main commit as the desktop app and the relay.
# Update all pins and lockfiles with scripts/update-leptoskit.py at the repo root.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_router = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
# skribble's hand-drawn components; its own leptoskit requirements stay
# crates.io ranges, so the [patch.crates-io] section below holds them to the
# same checkout as the pins above (one leptoskit in the graph).
skribble_leptoskit = { git = "https://github.com/openbudgetfun/skribble", rev = "46b8e635b1d983f92054d13fcc0bc513e7b9a43c" }

[package]
name = "landing"
description = "The Quant landing page."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["ssr"]
ssr = ["landing_app/web", "landing_app/ssr", "leptoskit/ssr"]

[dependencies]
landing_app = { path = "landing_app", default-features = false }
landing_backend = { path = "landing_backend" }
leptoskit = { workspace = true, features = ["server", "rpc-ssr"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
similar_names = "allow"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"

[patch.crates-io]
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
