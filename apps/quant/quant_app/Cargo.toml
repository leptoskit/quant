[package]
name = "quant_app"
description = "The Quant desktop window: status, saved moments, agents, and the audit log."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The native Wasm guest. The window talks only to the app's own service.
native = ["leptoskit/guest", "leptoskit_bridge/guest"]
macos = ["native", "leptoskit/macos"]
android = ["native", "leptoskit/android"]
# The DevTools agents; `leptoskit dev` turns this on, `leptoskit build` never does.
devtools = ["leptoskit/devtools"]

[dependencies]
leptoskit = { workspace = true }
quant_model = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptoskit_bridge = { workspace = true }

[dev-dependencies]
leptoskit_testing = { workspace = true }

[build-dependencies]
leptoskit_build = { workspace = true }

[lints]
workspace = true
