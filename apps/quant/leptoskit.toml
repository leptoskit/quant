#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

schema_version = 0
plugins = []

[app]
name = "quant"
version = "0.1.0"
default_platform = "macos"
# The Android collector joins this app later; macOS is the menu-bar remote.
platforms = ["macos"]
# The Riemann mark; leptoskit makes the .icns (and later the Android
# launcher icons) from it.
icon = "../../assets/brand/icon.svg"

[build]
backend = false
client_package = "quant_app"

[native]
package_id = "dev.leptoskit.quant"
viewport_width = 520.0
viewport_height = 640.0
# The app's native service (`quant`) and the Secure Enclave signing keys the
# window uses for Touch ID (`device-keys`).
plugins = ["quant", "device-keys"]

[codepush]
enabled = false

[lint]
markup = "builder"

[lint.rules]
markup_style = "deny"
component_attribute = "deny"
