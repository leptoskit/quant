#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

schema_version = 0
plugins = []

[app]
name = "quant"
version = "0.1.0"
default_platform = "macos"
# The Android collector joins this app later; macOS is the menu-bar remote.
platforms = ["macos"]

[build]
backend = false
client_package = "quant_app"

[native]
package_id = "dev.leptoskit.quant"
viewport_width = 520.0
viewport_height = 640.0
# The app's one native service: quant_service's `quant` runtime package.
plugins = ["quant"]

[codepush]
enabled = false

[lint]
markup = "builder"

[lint.rules]
markup_style = "deny"
component_attribute = "deny"
