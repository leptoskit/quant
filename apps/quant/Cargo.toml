# The Quant desktop app: a menu-bar remote control for `quant daemon`.
#
# Its own workspace, outside the core one: the window is a Wasm guest and the
# host is built by the leptoskit CLI. See readme.md.
[workspace]
resolver = "3"
members = ["quant_model", "quant_app", "quant_service", "macos"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/leptoskit/quant"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
quant_model = { path = "quant_model" }
quant_service = { path = "quant_service" }
quant_access = { path = "../../crates/quant_access" }
quant_api = { path = "../../crates/quant_api" }
quant_client = { path = "../../crates/quant_client" }
quant_core = { path = "../../crates/quant_core" }

# Pin the latest verified main commit; update with scripts/update-leptoskit.py.
# `scripts/local-sdk.sh` points these at a local checkout instead.
leptoskit = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_bridge = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_bridge_ffi = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_build = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_native = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }
leptoskit_plugin_autostart = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_plugin_device_keys = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_plugin_menu = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_plugin_tray = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_testing = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd" }
leptoskit_wasm = { git = "https://github.com/leptoskit/leptoskit", rev = "353b6165d9f2c86e9c92284ec5022b32df9f35dd", default-features = false }

dispatch2 = "0.3"
base64 = "0.22"
jiff = { version = "0.2", features = ["serde"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"

# Keep host proc-macros loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
