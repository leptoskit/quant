#:schema https://leptoskit.dev/schemas/leptoskit.v0.schema.json

schema_version = 0
plugins = []

[app]
name = "relay"
version = "0.1.0"
# The relay is a server and nothing else: no web client, no native apps.
platforms = ["server"]
default_platform = "server"
# `ssr` with no client package: the server binary is the whole app.
render = "ssr"

# Backend only: no client package to build.

[serve]
address = "127.0.0.1"
port = 3000

[db]
dialect = "sqlite"
url_env = "DATABASE_URL"
