# The relay's tables: registrations, invites, and daily byte counts.
#
# The schema is declared here and applied by the server at startup; after
# changing a table, run `leptoskit db migration create <name>` and commit
# what it writes under migrations/.
[package]
name = "relay_db"
description = "The Quant relay's database: registrations, invites, and usage."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
leptoskit_db = { workspace = true }
quant_relay = { path = "../../../crates/quant_relay", default-features = false }

[features]
server = ["leptoskit_db/sqlite"]
# Postgres instead of SQLite, for a relay run beside one.
postgres = ["leptoskit_db/postgres"]

[lints]
workspace = true
