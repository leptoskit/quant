# The Quant relay: joins clients to `quant daemon` over TLS it cannot read.
#
# Its own workspace, outside the root one: it deploys with leptoskit's
# generated files and keeps its rows in its own database. The protocol lives
# in the root workspace's `quant_relay` crate, which this and the daemon both
# build from, so the two ends cannot drift. See readme.md.
[workspace]
resolver = "3"
members = ["relay_db"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"
repository = "https://github.com/leptoskit/quant"
rust-version = "1.95.0"

[workspace.dependencies]
relay_db = { path = "relay_db" }
# Use the same main commit as the desktop app and the Docker build CLI.
# Update all pins and lockfiles with scripts/update-leptoskit.py at the repo root.
leptoskit_axum = { git = "https://github.com/leptoskit/leptoskit", rev = "a8fec995896be1fea532ee589dfb8869c28f1df7" }
leptoskit_db = { git = "https://github.com/leptoskit/leptoskit", rev = "a8fec995896be1fea532ee589dfb8869c28f1df7" }

axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package]
name = "relay"
description = "The Quant relay: a blind pipe between clients and quant daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# leptoskit's ssr render mode builds this package with its `ssr` feature;
# the relay is a plain server, so the feature turns nothing on.
ssr = []

[dependencies]
relay_db = { workspace = true, features = ["server"] }
leptoskit_axum = { workspace = true }
leptoskit_db = { workspace = true, features = ["sqlite"] }
# leptoskit_axum serves; the WebSocket routes themselves are plain axum,
# because leptoskit's server toolkit has no WebSocket support.
axum = { workspace = true }
clap = { workspace = true }
data-encoding = "2"
getrandom = "0.4"
quant_relay = { path = "../../crates/quant_relay", default-features = false, features = [
	"server",
] }
tokio = { workspace = true }

[dev-dependencies]
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
similar_names = "allow"

[lints]
workspace = true
